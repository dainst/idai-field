<div id="geometries-button"
        class="btn btn-primary btn-square layer-button"
        ngbTooltip="Geometrien ein-/ausblenden"
        i18n-ngbTooltip="@@resources.map.geometries"
        container="body"
        placement="left"
        triggers="manual"
        #geometriesButtonTooltip="ngbTooltip"
        (mouseover)="geometriesButtonTooltip.open()"
        (mouseleave)="geometriesButtonTooltip.close()"
        (mousedown)="geometriesButtonTooltip.close()"
        [class.active]="opened"
        [class.disabled]="disabled"
        (click)="!disabled && toggle()">
    <span class="mdi mdi-map-marker-multiple mdi-18px"></span>
</div>
<div *ngIf="opened" id="geometries-menu" class="card">
    <div class="card-body">
        <category-picker [topLevelCategoriesArray]="topLevelCategories"
                         [selectedCategories]="selectedCategories"
                         [allowPickingAbstractCategories]="true"
                         [showMapButtons]="true"
                         [allCategoriesOptionVisible]="true"
                         (onCategoryPicked)="toggleCategory($event)"
                         (onCategoryFocused)="focusCategory($event)">
        </category-picker>
    </div>
</div>
