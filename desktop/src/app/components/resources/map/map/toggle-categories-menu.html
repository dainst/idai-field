<div id="toggle-categories-button"
        class="btn btn-primary btn-square layer-button"
        [class.active]="opened"
        [class.disabled]="disabled"
        (click)="!disabled && toggle()">
    <span class="mdi mdi-eye mdi-18px"></span>
</div>
<div *ngIf="opened" id="toggle-categories-menu" class="card">
    <div class="card-body">
        <category-picker [topLevelCategoriesArray]="topLevelCategories"
                         [selectedCategories]="selectedCategories"
                         [allowPickingAbstractCategories]="true"
                         (onCategoryPicked)="toggleCategory($event)">
        </category-picker>
    </div>
</div>
